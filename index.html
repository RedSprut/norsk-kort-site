    <span class="tts-wave"><i></i><i></i><i></i></span>
    <span class="tts-label">Читаю…</span>
    <button class="media-btn sm main" data-tts="toggle" title="Пауза / продолжить"></button>
    <button class="media-btn sm" data-tts="restart" title="Сначала"><svg class="ico" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M18.5 19.5 9 12l9.5-7.5z" fill="currentColor" stroke="none"/><path d="M5.5 5v14"/></svg></button>
    <button class="media-btn sm tts-x" data-tts="stop" title="Остановить чтение и закрыть" aria-label="Остановить чтение и закрыть"><svg class="ico" width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><path d="M6 6l12 12M18 6 6 18"/></svg></button>
