<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <title>Norsk – UKR·RU AI</title>
  <defs>
    <!-- Ukraine: the flag's two bands, blue on top and yellow below, split by a straight line at y = UA_SPLIT -->
    <linearGradient id="uaBlue" x1="512" y1="0" x2="80" y2="512" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#1f74dc"/>
      <stop offset=".4" stop-color="#0057b7"/>
      <stop offset="1" stop-color="#0a3c8e"/>
    </linearGradient>
    <linearGradient id="uaYellow" x1="0" y1="256" x2="0" y2="512" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#ffd700"/>
      <stop offset="1" stop-color="#ffc800"/>
    </linearGradient>
    <!-- the yellow trail: a soft ribbon from the band, fading toward its thin tail under «RU» -->
    <filter id="waveSoft" filterUnits="userSpaceOnUse" x="-512" y="-512" width="1536" height="1536">
      <feGaussianBlur stdDeviation="7"/>
    </filter>
    <filter id="hlSoft" filterUnits="userSpaceOnUse" x="-512" y="-512" width="1536" height="1536">
      <feGaussianBlur stdDeviation="1.5"/>
    </filter>
    <linearGradient id="trailFadeG" x1="190" y1="486" x2="236" y2="300" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#000"/><stop offset=".3" stop-color="#909090"/><stop offset=".65" stop-color="#f0f0f0"/><stop offset="1" stop-color="#fff"/>
    </linearGradient>
    <mask id="trailMask" maskUnits="userSpaceOnUse" x="-400" y="-400" width="1312" height="1312">
      <path d="M196 470 C206 420 220 350 236 290 L246 262 L300 262 L300 900 L196 900 Z" fill="url(#trailFadeG)" filter="url(#waveSoft)"/>
    </mask>
    <linearGradient id="hlG" x1="214" y1="448" x2="240" y2="290" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#fffbe0" stop-opacity="0"/><stop offset=".45" stop-color="#fffbe0" stop-opacity=".45"/><stop offset=".85" stop-color="#fffbe0" stop-opacity=".35"/><stop offset="1" stop-color="#fffbe0" stop-opacity="0"/>
    </linearGradient>
    <!-- Norway: crisp flag, faded out along a curved front (three multiplied linear fades) -->
    <linearGradient id="red" x1="0" y1="0" x2="0" y2="400" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#f0434b"/>
      <stop offset="1" stop-color="#cf2836"/>
    </linearGradient>
    <filter id="flagSoft" filterUnits="userSpaceOnUse" x="-512" y="-512" width="1536" height="1536">
      <feGaussianBlur stdDeviation="14"/>
    </filter>
    <linearGradient id="flagFadeG" x1="0" y1="252" x2="28" y2="378" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#fff"/><stop offset=".25" stop-color="#e6e6e6"/><stop offset=".5" stop-color="#9a9a9a"/><stop offset=".75" stop-color="#404040"/><stop offset="1" stop-color="#000"/>
    </linearGradient>
    <mask id="flagMask" maskUnits="userSpaceOnUse" x="-400" y="-400" width="1312" height="1312">
      <path d="M-400 -400 H238 V-80 C238 140 237 205 232 256 C226 320 216 380 212 600 V900 H-400 Z" fill="#fff" filter="url(#flagSoft)"/>
    </mask>
    <mask id="flagFadeMask" maskUnits="userSpaceOnUse" x="-400" y="-400" width="1312" height="1312">
      <rect x="-400" y="-400" width="1312" height="1312" fill="url(#flagFadeG)"/>
    </mask>
    <!-- the blue haze in the lower-left corner -->
    <linearGradient id="hazeG" x1="0" y1="300" x2="230" y2="470" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#143a84"/><stop offset=".6" stop-color="#184a96"/><stop offset="1" stop-color="#1f5ca2"/>
    </linearGradient>
    <filter id="hazeSoft" filterUnits="userSpaceOnUse" x="-512" y="-512" width="1536" height="1536">
      <feGaussianBlur stdDeviation="12"/>
    </filter>
    <linearGradient id="sheen" x1="0" y1="0" x2="0" y2="512" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#fff" stop-opacity=".14"/>
      <stop offset=".3" stop-color="#fff" stop-opacity="0"/>
      <stop offset=".8" stop-color="#000" stop-opacity="0"/>
      <stop offset="1" stop-color="#000" stop-opacity=".12"/>
    </linearGradient>
    <!-- tags -->
    <linearGradient id="tagRed" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#f4505a"/><stop offset="1" stop-color="#c81e2e"/>
    </linearGradient>
    <linearGradient id="tagBlue" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#2a82f0"/><stop offset="1" stop-color="#145bd0"/>
    </linearGradient>
    <linearGradient id="tagYellow" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffe04a"/><stop offset="1" stop-color="#f9c414"/>
    </linearGradient>
    <linearGradient id="gloss" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fff" stop-opacity=".38"/>
      <stop offset="1" stop-color="#fff" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="card" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff"/><stop offset=".6" stop-color="#eef2f8"/><stop offset="1" stop-color="#d3dae7"/>
    </linearGradient>
    <linearGradient id="ruFill" x1="0" y1="-72" x2="0" y2="0" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#ffffff"/><stop offset="1" stop-color="#e2fbff"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="160%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="3"/>
      <feOffset dy="4" result="o"/>
      <feFlood flood-color="#071b4d" flood-opacity=".4"/>
      <feComposite in2="o" operator="in"/>
      <feMerge><feMergeNode/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="ruGlow" x="-20%" y="-30%" width="140%" height="160%">
      <feGaussianBlur stdDeviation="4"/>
    </filter>
    <!-- robot -->
    <!-- brushed steel: silver highlight top-left, grey-blue body, dark steel-blue shading bottom-right -->
    <linearGradient id="metal" x1="0" y1="0" x2=".75" y2="1">
      <stop offset="0" stop-color="#f3f7fb"/><stop offset=".32" stop-color="#cbd6e3"/>
      <stop offset=".7" stop-color="#9aabc1"/><stop offset="1" stop-color="#63769a"/>
    </linearGradient>
    <linearGradient id="metalDark" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#b4c2d3"/><stop offset=".55" stop-color="#7d8fa9"/><stop offset="1" stop-color="#4a5a76"/>
    </linearGradient>
    <linearGradient id="steelNavy" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#3a4d74"/><stop offset="1" stop-color="#18223f"/>
    </linearGradient>
    <linearGradient id="visor" x1="0" y1="0" x2=".6" y2="1">
      <stop offset="0" stop-color="#28306a"/><stop offset="1" stop-color="#090c24"/>
    </linearGradient>
    <linearGradient id="metalSide" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#2a3a5c" stop-opacity=".4"/><stop offset=".2" stop-color="#2a3a5c" stop-opacity="0"/>
      <stop offset=".72" stop-color="#2a3a5c" stop-opacity="0"/><stop offset="1" stop-color="#2a3a5c" stop-opacity=".5"/>
    </linearGradient>
    <radialGradient id="bulb" cx=".36" cy=".32" r=".75">
      <stop offset="0" stop-color="#ffffff"/><stop offset=".4" stop-color="#8af0ff"/><stop offset="1" stop-color="#1aa8e8"/>
    </radialGradient>
    <radialGradient id="chestGlow">
      <stop offset=".7" stop-color="#5fe8ff" stop-opacity=".6"/><stop offset=".85" stop-color="#5fe8ff" stop-opacity=".22"/><stop offset="1" stop-color="#5fe8ff" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="chestCore">
      <stop offset="0" stop-color="#ffffff"/><stop offset=".3" stop-color="#9ff4ff"/><stop offset=".62" stop-color="#2aa6dc"/><stop offset="1" stop-color="#0d2a58"/>
    </radialGradient>
    <radialGradient id="silverBall" cx=".36" cy=".32" r=".75">
      <stop offset="0" stop-color="#ffffff"/><stop offset=".45" stop-color="#b4f2ff"/><stop offset="1" stop-color="#3cb6e6"/>
    </radialGradient>
  </defs>
  <defs>
    <linearGradient id="aiFillE" x1="0" y1="-73" x2="0" y2="1" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#ffffff"/><stop offset=".6" stop-color="#f4f7fc"/><stop offset="1" stop-color="#d9e2f0"/>
    </linearGradient>
    <linearGradient id="aiSideE" x1="0" y1="-73" x2="0" y2="8" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#4a5a7c"/><stop offset="1" stop-color="#16244a"/>
    </linearGradient>
    <filter id="aiShadowE" filterUnits="userSpaceOnUse" x="-512" y="-512" width="1536" height="1536">
      <feGaussianBlur stdDeviation="9"/>
    </filter>
    <filter id="aiGlowE" filterUnits="userSpaceOnUse" x="-512" y="-512" width="1536" height="1536">
      <feGaussianBlur stdDeviation="14"/>
    </filter>
  </defs>
  <clipPath id="squircle"><rect width="512" height="512" rx="120"/></clipPath>
  <g clip-path="url(#squircle)">
  <g id="bg">
    <rect x="-400" y="-400" width="1312" height="1312" fill="url(#uaBlue)"/>
    <rect x="-400" y="256" width="1312" height="656" fill="url(#uaYellow)"/>
    
    <g mask="url(#flagMask)"><g >
      <rect x="-400" y="-400" width="1312" height="1312" fill="url(#red)"/>
      <rect x="74" y="-400" width="94" height="1312" fill="#fff"/>
      <rect x="-400" y="152" width="1312" height="86" fill="#fff"/>
      <rect x="98" y="-400" width="46" height="1312" fill="#16326e"/>
      <rect x="-400" y="174" width="1312" height="42" fill="#16326e"/>
    </g></g>
    <rect x="-400" y="256" width="1312" height="656" fill="url(#uaYellow)" mask="url(#trailMask)"/>
    <path d="M214 448 C220 410 228 350 240 290" fill="none" stroke="url(#hlG)" stroke-width="3.5" stroke-linecap="round" filter="url(#hlSoft)"/>
  </g><rect width="512" height="512" fill="url(#sheen)"/>
    <path transform="translate(346 484) scale(2.9)" d="M2 -8.11L-1.42 -17.09L-30.52 -17.09L-33.94 -7.91Q-35.94 -2.54 -37.35 -0.66Q-38.77 1.22 -41.99 1.22Q-44.73 1.22 -46.83 -0.78Q-48.93 -2.78 -48.93 -5.32Q-48.93 -6.79 -48.44 -8.35Q-47.95 -9.91 -46.83 -12.7L-28.52 -59.18Q-27.73 -61.18 -26.64 -63.99Q-25.54 -66.8 -24.29 -68.65Q-23.05 -70.51 -21.02 -71.66Q-18.99 -72.8 -16.02 -72.8Q-12.99 -72.8 -10.96 -71.66Q-8.94 -70.51 -7.69 -68.7Q-6.45 -66.89 -5.59 -64.82Q-4.74 -62.74 -3.42 -59.28L15.28 -13.09Q17.48 -7.81 17.48 -5.42Q17.48 -2.93 15.41 -0.85Q13.33 1.22 10.4 1.22Q8.69 1.22 7.47 0.61Q6.25 0 5.42 -1.05Q4.59 -2.1 3.64 -4.27Q2.69 -6.45 2 -8.11ZM-26.71 -27.98L-5.32 -27.98L-16.11 -57.52L-26.71 -27.98ZM28.71 -7.62L28.71 -64.01Q28.71 -68.41 30.71 -70.61Q32.71 -72.8 35.89 -72.8Q39.16 -72.8 41.19 -70.63Q43.21 -68.46 43.21 -64.01L43.21 -7.62Q43.21 -3.17 41.19 -0.98Q39.16 1.22 35.89 1.22Q32.76 1.22 30.74 -1Q28.71 -3.22 28.71 -7.62Z" fill="#5a3600" stroke="#5a3600" stroke-width="12" opacity=".4" filter="url(#aiShadowE)"/>
    <path transform="translate(340 470) scale(2.9)" d="M2 -8.11L-1.42 -17.09L-30.52 -17.09L-33.94 -7.91Q-35.94 -2.54 -37.35 -0.66Q-38.77 1.22 -41.99 1.22Q-44.73 1.22 -46.83 -0.78Q-48.93 -2.78 -48.93 -5.32Q-48.93 -6.79 -48.44 -8.35Q-47.95 -9.91 -46.83 -12.7L-28.52 -59.18Q-27.73 -61.18 -26.64 -63.99Q-25.54 -66.8 -24.29 -68.65Q-23.05 -70.51 -21.02 -71.66Q-18.99 -72.8 -16.02 -72.8Q-12.99 -72.8 -10.96 -71.66Q-8.94 -70.51 -7.69 -68.7Q-6.45 -66.89 -5.59 -64.82Q-4.74 -62.74 -3.42 -59.28L15.28 -13.09Q17.48 -7.81 17.48 -5.42Q17.48 -2.93 15.41 -0.85Q13.33 1.22 10.4 1.22Q8.69 1.22 7.47 0.61Q6.25 0 5.42 -1.05Q4.59 -2.1 3.64 -4.27Q2.69 -6.45 2 -8.11ZM-26.71 -27.98L-5.32 -27.98L-16.11 -57.52L-26.71 -27.98ZM28.71 -7.62L28.71 -64.01Q28.71 -68.41 30.71 -70.61Q32.71 -72.8 35.89 -72.8Q39.16 -72.8 41.19 -70.63Q43.21 -68.46 43.21 -64.01L43.21 -7.62Q43.21 -3.17 41.19 -0.98Q39.16 1.22 35.89 1.22Q32.76 1.22 30.74 -1Q28.71 -3.22 28.71 -7.62Z" fill="url(#aiFillE)" stroke="#16326e" stroke-width="11" stroke-linejoin="round" paint-order="stroke"/>
  </g>
</svg>
